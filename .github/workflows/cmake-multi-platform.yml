name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libx11-dev \
          libxtst-dev \
          libxext-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libxfixes-dev

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Locate binaries
      id: locate
      shell: bash
      run: |
        BIN_DIR="${{ steps.strings.outputs.build-output-dir }}"

        if [ "${{ runner.os }}" = "Windows" ]; then
          SEARCH_DIR="$BIN_DIR/${{ matrix.build_type }}"
          FILES=$(find "$SEARCH_DIR" -maxdepth 2 -type f -name '*.exe' 2>/dev/null)
        else
          FILES=$(find "$BIN_DIR" -maxdepth 2 -type f -perm -111 2>/dev/null | grep -v '/CMakeFiles/')
        fi

        echo "=== located files ==="
        echo "$FILES"
        echo "=== end ==="

        {
          echo "paths<<EOF"
          echo "$FILES"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: auto-entry-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}
        path: ${{ steps.locate.outputs.paths }}
        if-no-files-found: error
        retention-days: 14

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
        files: |
          ${{ runner.os == 'Windows' && format('{0}/{1}/*.exe', steps.strings.outputs.build-output-dir, matrix.build_type) || format('{0}/auto-entry', steps.strings.outputs.build-output-dir) }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
